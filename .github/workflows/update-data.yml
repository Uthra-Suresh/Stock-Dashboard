name: Update prices

on:
  schedule:
    # 12:30 UTC = 18:00 IST, comfortably after the NSE close at 15:30 IST.
    # Weekdays only. Cron on GitHub is always UTC, never your local time.
    - cron: "30 12 * * 1-5"
  # Lets you run it by hand from the Actions tab. Add this to every scheduled
  # workflow you write - waiting a day to test a cron job is miserable.
  workflow_dispatch:

permissions:
  contents: write

# Stop two runs from committing at the same time and colliding.
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data

          # On a holiday nothing changes and an empty commit would fail the
          # step. Only commit when there is actually a diff.
          if git diff --staged --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update prices $(date -u +%F)"

            # The checkout happened at the start of this run. If anything
            # landed on the branch since then - a push from your laptop, or
            # another workflow - our push is rejected as non-fast-forward.
            # Rebase our single data commit on top of whatever is there now
            # and try again. Safe here because this job only ever touches
            # frontend/public/data, so it cannot conflict with your edits.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected, rebasing (attempt $attempt)"
              git pull --rebase origin "$GITHUB_REF_NAME"
            done

            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # THIS IS THE IMPORTANT BIT.
  #
  # A push made with the built-in GITHUB_TOKEN does NOT trigger other
  # workflows. GitHub does this deliberately to stop workflows looping
  # forever. So the commit above will never set off deploy.yml on its own,
  # and your site would sit there serving yesterday's numbers with both
  # workflows showing green.
  #
  # Calling the deploy workflow directly is the fix.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
